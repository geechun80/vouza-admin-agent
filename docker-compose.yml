# =============================================================================
# Vouza Admin Agent — Docker Compose
#
# Single-command launch for self-hosters and dev environments.
#   docker compose up -d        # start everything in background
#   docker compose logs -f      # tail live logs
#   docker compose down         # graceful stop
#   docker compose up -d --build   # after "git pull", rebuild with the new code
#
# Files & env:
#   - .env at repo root is OPTIONAL (copy .env.example to .env to set an
#     operator key or VOUZA_SECRET_KEY). Users can paste their own AI key
#     in the setup wizard instead.
#   - data/ persists config, conversations, WhatsApp login, etc.
#
# Open http://localhost:3456 — it is only reachable from this computer.
# =============================================================================

services:

  # ── Main Vouza Admin Agent ────────────────────────────────────────────────
  admin-agent:
    build: .
    image: vouza-admin-agent:latest
    # Built locally from this folder — never pulled from Docker Hub (that
    # printed a confusing "pull access denied" warning).
    pull_policy: build
    container_name: vouza-admin-agent
    restart: unless-stopped
    ports:
      # This computer only. The dashboard has no login screen, so it must not
      # be published on your network; for remote use, connect through an SSH
      # tunnel or Tailscale to this machine's localhost:3456.
      - "127.0.0.1:3456:3456"
    volumes:
      # Persists config, conversations, memories, WhatsApp auth, logs.
      # Bind mount (./data) so you can also inspect/back up from host.
      - ./data:/app/data
    environment:
      # Required: operator-supplied AI key (Anthropic/OpenAI/OpenRouter/etc.)
      # When set, customers can chat with the Guide Bot before adding their own key.
      VOUZA_API_KEY:      ${VOUZA_API_KEY:-}
      VOUZA_API_PROVIDER: ${VOUZA_API_PROVIDER:-openrouter}
      VOUZA_API_MODEL:    ${VOUZA_API_MODEL:-google/gemini-2.5-flash-lite}
      VOUZA_BRAND_NAME:   ${VOUZA_BRAND_NAME:-Vouza}
      # Container listens on all interfaces; only requests addressed to
      # localhost are answered (the port above is published on 127.0.0.1).
      DASHBOARD_BIND:              "0.0.0.0"
      DASHBOARD_DOCKER_LOCAL_ONLY: "true"
      # Docker has no Windows/macOS key store: set a 64-hex-char key here (or
      # in .env) to protect saved passwords; otherwise one is kept in data/.
      VOUZA_SECRET_KEY:   ${VOUZA_SECRET_KEY:-}
      LOG_LEVEL:          ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3456/api/operator-defaults > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ── Optional: WAHA (WhatsApp HTTP API) ────────────────────────────────────
  # Enable with: docker compose --profile waha up -d
  # If you don't need WAHA, the agent uses the built-in Baileys (QR scan) which
  # needs zero extra services. Only enable WAHA if you specifically want a
  # WhatsApp Business API style integration.
  waha:
    image: ghcr.io/devlikeapro/waha:latest
    container_name: vouza-waha
    restart: unless-stopped
    profiles: ["waha"]
    ports:
      - "3000:3000"
    volumes:
      - ./data/waha-sessions:/app/.sessions
    environment:
      WAHA_PRINT_QR: "false"
